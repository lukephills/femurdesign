        <style>
            #theremin-start {
                position: fixed;
                z-index: 20;
                padding: 0;
                border: 0;
                background: transparent;
                appearance: none;
                cursor: pointer;
            }
            #theremin-start::before {
                content: '';
                position: absolute;
                top: 50%;
                left: 50%;
                width: 0;
                height: 0;
                border-top: 28px solid transparent;
                border-bottom: 28px solid transparent;
                border-left: 44px solid #444;
                transform: translate(-50%, -50%);
            }
        </style>

    <body>
        <div id="app"></div>
        <script>
            (function () {
                var NativeAudioContext = window.AudioContext || window.webkitAudioContext;

                if (!NativeAudioContext) return;

                window.thereminAudioContexts = [];
                function ThereminAudioContext() {
                    var context = new NativeAudioContext();
                    window.thereminAudioContexts.push(context);
                    return context;
                }
                ThereminAudioContext.prototype = NativeAudioContext.prototype;
                window.AudioContext = window.webkitAudioContext = ThereminAudioContext;
            }());
        </script>
        <script src="static/app-a83b5849d1ea47927780.js"></script>
        <button id="theremin-start" type="button" aria-label="Play theremin"></button>
        <script>
            (function () {
                var button = document.getElementById('theremin-start');
                var surface = document.querySelector('#touchArea canvas');

                function positionButton() {
                    var bounds = surface.getBoundingClientRect();
                    button.style.left = bounds.left + 'px';
                    button.style.top = bounds.top + 'px';
                    button.style.width = bounds.width + 'px';
                    button.style.height = bounds.height + 'px';
                }

                button.addEventListener('click', function () {
                    var contexts = (window.thereminAudioContexts || []).filter(function (context) {
                        return context.state !== 'closed';
                    });
                    var resumes = contexts.map(function (context) {
                        return context.resume ? context.resume() : Promise.resolve();
                    });

                    Promise.all(resumes).then(function () {
                        button.parentNode.removeChild(button);
                    });
                });

                positionButton();
                window.addEventListener('resize', positionButton);
            }());
        </script>
